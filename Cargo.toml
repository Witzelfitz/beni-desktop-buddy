[workspace]
resolver = "3"
members = ["crates/buddy-core", "crates/buddy-cli", "crates/buddy-ipc"]
# Desktop has its own lockfile: the headless core stays testable without a GPU or GUI dependencies.
exclude = ["apps/desktop"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.metadata.beni-release]
# Increase for every published stable or beta build; never reuse a released number.
build-number = 4

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
