[package]
name = "beni-desktop-buddy"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]
resolver = "3"

[dependencies]
buddy-core = { path = "../../crates/buddy-core" }
buddy-ipc = { path = "../../crates/buddy-ipc" }
winit = { version = "=0.30.13", default-features = false, features = ["x11", "wayland"] }
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland", "persistence"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSScreen", "NSEvent", "block2", "NSApplication", "NSRunningApplication"] }
block2 = "=0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
embed-resource = "=3.0.11"
