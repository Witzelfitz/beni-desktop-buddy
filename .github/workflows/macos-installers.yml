name: macOS installers
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Welche Mac-Pakete bauen?'
        type: choice
        options: [aarch64, x86_64, both]
        default: aarch64
      mode:
        description: 'Release braucht einen v-Tag und eingerichtete Apple-Secrets'
        type: choice
        options: [development, release]
        default: development
permissions:
  contents: read
concurrency:
  group: macos-installers-${{ github.ref }}-${{ inputs.architecture || 'both' }}
  cancel-in-progress: false
jobs:
  installer:
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'both' && '[{"architecture":"aarch64","runner":"macos-15"},{"architecture":"x86_64","runner":"macos-15-intel"}]' || (inputs.architecture == 'x86_64' && '[{"architecture":"x86_64","runner":"macos-15-intel"}]' || '[{"architecture":"aarch64","runner":"macos-15"}]')) }}
    runs-on: ${{ matrix.runner }}
    env:
      BENI_PACKAGE_MODE: ${{ inputs.mode }}
      BENI_PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check release source and version
        run: |
          python3 scripts/release.py check-versions
          if [[ "$BENI_PACKAGE_MODE" == "release" ]]; then
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              echo "Release-Installer benötigen einen freigegebenen v-Tag." >&2
              exit 1
            fi
            python3 scripts/release.py check-versions --tag "$GITHUB_REF_NAME"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
      - name: Preflight optional CI signing credentials
        if: env.BENI_PACKAGE_MODE == 'release'
        env:
          BENI_MACOS_CERTIFICATE_P12: ${{ secrets.BENI_MACOS_CERTIFICATE_P12 }}
          BENI_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.BENI_MACOS_CERTIFICATE_PASSWORD }}
          BENI_APPLE_API_KEY: ${{ secrets.BENI_APPLE_API_KEY }}
          BENI_APPLE_API_KEY_ID: ${{ secrets.BENI_APPLE_API_KEY_ID }}
          BENI_APPLE_API_ISSUER: ${{ secrets.BENI_APPLE_API_ISSUER }}
        run: python3 scripts/macos-ci-signing.py --architecture "$BENI_PACKAGE_ARCHITECTURE" --check-only
      - name: Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
      - name: Cache Rust workspaces
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop -> target
          shared-key: macos-installer-${{ matrix.architecture }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Packaging regression tests
        run: python3 scripts/check-macos-packaging.py
      - name: Build development installer
        if: env.BENI_PACKAGE_MODE == 'development'
        run: python3 scripts/package-macos.py installer --mode development --architecture "$BENI_PACKAGE_ARCHITECTURE"
      - name: Build signed and notarized installer
        if: env.BENI_PACKAGE_MODE == 'release'
        env:
          BENI_MACOS_CERTIFICATE_P12: ${{ secrets.BENI_MACOS_CERTIFICATE_P12 }}
          BENI_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.BENI_MACOS_CERTIFICATE_PASSWORD }}
          BENI_APPLE_API_KEY: ${{ secrets.BENI_APPLE_API_KEY }}
          BENI_APPLE_API_KEY_ID: ${{ secrets.BENI_APPLE_API_KEY_ID }}
          BENI_APPLE_API_ISSUER: ${{ secrets.BENI_APPLE_API_ISSUER }}
        run: python3 scripts/macos-ci-signing.py --architecture "$BENI_PACKAGE_ARCHITECTURE"
      - name: Native installation and window smoke test
        run: |
          version="$(python3 scripts/release.py version)"
          suffix=""
          if [[ "$BENI_PACKAGE_MODE" == "development" ]]; then suffix="-development"; fi
          image="dist/macos/beni-buddy-$version-macos-$BENI_PACKAGE_ARCHITECTURE$suffix.dmg"
          python3 scripts/check-macos-installer.py "$image" --architecture "$BENI_PACKAGE_ARCHITECTURE" --mode "$BENI_PACKAGE_MODE" --launch --attestation "$image.native.json"
      - name: Store reviewed installer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-${{ matrix.architecture }}-${{ env.BENI_PACKAGE_MODE }}
          retention-days: 7
          path: |
            dist/macos/*.dmg
            dist/macos/*.sha256
            dist/macos/*.build.json
            dist/macos/*.native.json
          if-no-files-found: error
