name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run --locked -p buddy-cli -- validate-assets
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup component add rustfmt clippy
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev
      - run: cargo fmt --manifest-path apps/desktop/Cargo.toml --check
      - run: cargo test --manifest-path apps/desktop/Cargo.toml --locked
      - run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo build --manifest-path apps/desktop/Cargo.toml --release --locked
      - name: Archive executable with Unix permissions
        shell: bash
        run: |
          mkdir -p dist
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ./scripts/package-macos.sh
            tar -czf "dist/beni-buddy-$RUNNER_OS.tar.gz" -C dist "Beni Buddy.app"
          else
            suffix=""
            if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
            tar -czf "dist/beni-buddy-$RUNNER_OS.tar.gz" -C apps/desktop/target/release "beni-desktop-buddy$suffix"
          fi
      - name: Store executable and lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beni-buddy-${{ matrix.os }}
          path: |
            apps/desktop/Cargo.lock
            dist/*.tar.gz
          if-no-files-found: error
