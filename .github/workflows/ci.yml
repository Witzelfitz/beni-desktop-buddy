name: Rust checks
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - .github/PULL_REQUEST_TEMPLATE.md
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - .github/PULL_REQUEST_TEMPLATE.md
  workflow_dispatch:
    inputs:
      build_packages:
        description: 'Release-Pakete für alle drei Plattformen bauen'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    timeout-minutes: 25
    env:
      BENI_BUILD_PACKAGES: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.build_packages) }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
      - name: Cache Rust dependencies for both workspaces
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev xvfb xauth weston
      - name: Release version consistency
        run: python scripts/release.py check-versions
      - name: macOS packaging policy tests
        run: python scripts/check-macos-packaging.py
      - name: Release schema and regression tests
        if: runner.os == 'Linux'
        run: |
          python -m venv "${{ runner.temp }}/beni-release-venv"
          "${{ runner.temp }}/beni-release-venv/bin/python" -m pip install -r scripts/requirements-release.txt
          "${{ runner.temp }}/beni-release-venv/bin/python" scripts/check-release.py
          "${{ runner.temp }}/beni-release-venv/bin/python" scripts/check-local-release.py
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path apps/desktop/Cargo.toml --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run --locked -p buddy-cli -- validate-assets
      - run: python scripts/check-integrations.py
      - name: Asset and icon provenance
        if: runner.os == 'Linux'
        run: python scripts/check-assets.py
      - run: cargo test --manifest-path apps/desktop/Cargo.toml --locked
      - run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets --locked -- -D warnings
      - name: Native Linux input-region smoke tests
        if: runner.os == 'Linux'
        run: bash scripts/check-input-linux.sh
      - name: Desktop debug build
        if: env.BENI_BUILD_PACKAGES != 'true'
        run: cargo build --manifest-path apps/desktop/Cargo.toml --locked
      - name: Desktop release build
        if: env.BENI_BUILD_PACKAGES == 'true'
        run: cargo build --manifest-path apps/desktop/Cargo.toml --release --locked
      - name: CLI release build
        if: env.BENI_BUILD_PACKAGES == 'true'
        run: cargo build --release --locked -p buddy-cli
      - name: Archive executable with Unix permissions
        if: env.BENI_BUILD_PACKAGES == 'true'
        shell: bash
        run: |
          mkdir -p dist
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ./scripts/package-macos.sh
            tar -czf "dist/beni-buddy-$RUNNER_OS.tar.gz" -C dist "Beni Buddy.app"
          else
            suffix=""
            if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
            package="beni-buddy-$RUNNER_OS"
            mkdir -p "dist/$package"
            cp "apps/desktop/target/release/beni-desktop-buddy$suffix" "target/release/beni-buddy-cli$suffix" "dist/$package/"
            cp -R integrations "dist/$package/"
            cp docs/INTEGRATIONS.md "dist/$package/"
            mkdir -p "dist/$package/icons"
            cp assets/app-icon/beni.png assets/app-icon/Beni.ico "dist/$package/icons/"
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              cp packaging/linux/io.witzelfitz.beni-buddy.desktop "dist/$package/"
            fi
            tar -czf "dist/$package.tar.gz" -C dist "$package"
          fi
      - name: Store executable and lockfile
        if: env.BENI_BUILD_PACKAGES == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beni-buddy-${{ matrix.os }}
          retention-days: 7
          path: |
            apps/desktop/Cargo.lock
            dist/*.tar.gz
          if-no-files-found: error
